name: Drift

on:
  schedule:
    - cron: '13 7 * * 1-5'     # weekdays 07:13 UTC (off the busy top of the hour)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: terraform plan (detect drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: "Plan with -detailed-exitcode (0 = no changes, 1 = error, 2 = drift or pending changes)"
        working-directory: deploy/terraform/envs/study
        run: |
          terraform init -input=false -backend-config=backend.hcl
          set +e
          terraform plan -input=false -lock-timeout=60s -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::drift detected: the cloud differs from the code (see the plan above)"
          fi
          exit "$code"
