# Referência para o PayFlow REAL (Compose/Kubernetes): o scrape usa um usuário só com o papel METRICS (decisão 138).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: payflow
    metrics_path: /actuator/prometheus
    basic_auth:
      username: scraper
      password_file: /run/secrets/prometheus_scrape_password   # segredo por arquivo (decisão 71), nunca no YAML
    static_configs:
      - targets: ["app:8081"]            # nome do serviço na rede do Compose; porta de GESTÃO, não publicada no host
