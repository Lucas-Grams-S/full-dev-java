apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payflow
  namespace: payflow
  labels: {app.kubernetes.io/name: payflow, app.kubernetes.io/part-of: payflow}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: payflow}
  minReplicas: 2                  # mínimo 2: disponibilidade durante atualização e perda de nó
  maxReplicas: 6                  # teto: o banco aguenta? (P2.06: conexões = réplicas x pool)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}   # % da REQUISIÇÃO (250m): ~150m por pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Pods, value: 2, periodSeconds: 60}
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 120}
