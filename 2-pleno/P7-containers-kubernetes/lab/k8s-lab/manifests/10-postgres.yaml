# Banco SÓ para o laboratório local. Em produção: serviço gerenciado (RDS, P9).
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: payflow
  labels: {app.kubernetes.io/name: db, app.kubernetes.io/part-of: payflow}
spec:
  clusterIP: None            # "headless": o DNS devolve o IP do pod (db-0.db.payflow.svc)
  selector: {app.kubernetes.io/name: db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: payflow
  labels: {app.kubernetes.io/name: db, app.kubernetes.io/part-of: payflow}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: db, app.kubernetes.io/part-of: payflow}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999            # usuário "postgres" da imagem oficial
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: payflow}
            - {name: POSTGRES_DB, value: payflow}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db/password}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "payflow", "-d", "payflow"]}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: db-secret, mountPath: /run/secrets/db, readOnly: true}
      volumes:
        - name: db-secret
          secret:
            secretName: payflow-db
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
