apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "payflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "payflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payflow.selectorLabels" . | nindent 8 }}
      annotations:
        # muda o hash => muda o pod template => novo rollout quando o ConfigMap muda
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: payflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: mgmt, containerPort: 8081}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: mgmt}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: mgmt}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: mgmt}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: {{ .Values.preStopSleepSeconds }}}
          volumeMounts:
            - {name: app-secret, mountPath: /run/secrets/app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: app-secret
          secret: {secretName: {{ .Values.existingSecret }}, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
