name: CD

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false      # nunca cancele um deploy no meio

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    name: build and push the image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write            # permite pedir o token OIDC (sem chave de acesso guardada)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Login to ECR
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to EC2 through SSM
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production      # permite exigir aprovacao manual e limita quem assume o papel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload the deploy bundle
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: aws s3 cp deploy/ "s3://$BUCKET/deploy/$GITHUB_SHA/" --recursive --exclude 'iam/*'
      - name: Run deploy.sh on the instance
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          TAG: ${{ needs.image.outputs.tag }}
        run: bash scripts/ci/ssm-deploy.sh
