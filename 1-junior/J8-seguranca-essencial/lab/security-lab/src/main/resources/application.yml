spring:
  application:
    name: security-lab
  web:
    locale: pt-BR
    locale-resolver: fixed
  mvc:
    static-path-pattern: /static/**

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PAYFLOW_SESSION
        http-only: true
        same-site: lax
        secure: true            # produção: só por HTTPS (o perfil dev desliga, porque o dev usa http://localhost)

management:
  endpoints:
    web:
      exposure:
        include: health,info

payflow:
  security:
    login:
      max-failures: 5
      lock-duration: PT15M
